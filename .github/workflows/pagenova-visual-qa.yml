name: PageNova Universal Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/components/builder-v2-*"
      - "frontend/src/lib/briefing-template-families.ts"
      - "frontend/src/lib/tp3-japanese-model1.ts"
      - "frontend/src/app/__qa/**"
      - "frontend/scripts/audit-builder-v2-visual.mjs"
      - "frontend/scripts/test-builder-v2-qa-visual.mjs"
      - ".github/workflows/pagenova-visual-qa.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "All 139 niches x 3 models x mobile/desktop (834 screenshots)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  visual-qa:
    name: Screenshot audit - real Builder V2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "qa-not-a-real-credential"
      PAGENOVA_QA_OUTPUT: "./qa-artifacts/builder-v2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and system libraries
        working-directory: frontend
        run: npx playwright-core install --with-deps chromium
      - name: Run independent static niche checks
        working-directory: frontend
        run: node --experimental-strip-types --test scripts/test-builder-v2-qa-visual.mjs scripts/test-tp3-japanese-preflight.mjs
      - name: Render and capture real templates
        working-directory: frontend
        run: |
          if node -e 'const e=require(process.env.GITHUB_EVENT_PATH);process.exit(e.inputs?.full==="true"?0:1)'; then
            npm run qa:visual:strict
          else
            node --experimental-strip-types scripts/audit-builder-v2-visual.mjs --strict
          fi
      - name: Upload HTML report, JSON findings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-v2-visual-qa
          path: frontend/qa-artifacts/builder-v2/
          retention-days: 7
          if-no-files-found: warn
