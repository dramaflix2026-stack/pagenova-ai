name: Landing Premium validation
on:
  pull_request:
    paths:
      - 'frontend/src/lib/landing/**'
      - 'frontend/src/app/app/landing/**'
      - 'frontend/src/app/api/landing/**'
      - 'frontend/src/app/lp/**'
      - 'frontend/src/components/sidebar.tsx'
      - '.github/workflows/landing-premium-validation.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
