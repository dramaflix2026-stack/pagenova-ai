name: PageNova Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    name: Local generators and commercial safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Test Builder reference generation and prompt quantities
        run: node --experimental-strip-types --test frontend/scripts/test-builder-v2-reference-generation.mjs
      - name: Test universal animation behavior
        run: node --test frontend/scripts/test-site-motion.mjs
      - name: Validate curated eBook recipes
        run: node frontend/scripts/validate-ebooks.mjs
      - name: Execute cookbook and print HTML without paid APIs
        run: node frontend/scripts/test-cookbook-runtime.mjs
      - name: Validate payment, limits and module wiring
        run: node frontend/scripts/validate-platform.mjs
