name: Install FRIGOLOG V7 on feature branch
on:
  push:
    branches:
      - feature/lovable-fidelity-crm-generator
    paths:
      - .github/workflows/install-frigolog-v7.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.ref == 'refs/heads/feature/lovable-fidelity-crm-generator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract V7 package safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path.cwd().resolve()
          source=root/'frontend/frigolog-next-integration-v7.zip'
          allowed_prefixes=('frontend/src/app/templates/frigolog/', 'frontend/public/lovable/frigolog/', 'scripts/verify-frigolog.mjs')
          with ZipFile(source) as archive:
              for info in archive.infolist():
                  if info.is_dir(): continue
                  name=info.filename
                  if not (name.startswith(allowed_prefixes[0]) or name.startswith(allowed_prefixes[1]) or name==allowed_prefixes[2]):
                      continue
                  target=(root/name).resolve()
                  if not target.is_relative_to(root): raise ValueError('Unsafe path')
                  if target.exists(): raise FileExistsError(f'Refusing overwrite: {name}')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(info))
          PY
      - name: Static verification
        run: node scripts/verify-frigolog.mjs
      - name: Commit extracted integration to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/templates/frigolog frontend/public/lovable/frigolog scripts/verify-frigolog.mjs
          git diff --cached --check
          git commit -m "Install FRIGOLOG V7 standalone preview route"
          git push origin HEAD:feature/lovable-fidelity-crm-generator
