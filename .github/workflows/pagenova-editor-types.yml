name: PageNova Universal Editor — TypeScript Validation
on:
  push:
    branches: [main]
    paths:
      - "frontend/src/app/app/builder-v2/page.tsx"
      - "frontend/src/lib/builder-v2-editor-*.ts"
      - "frontend/scripts/test-builder-v2-editor-*.mjs"
      - ".github/workflows/pagenova-editor-types.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/app/app/builder-v2/page.tsx"
      - "frontend/src/lib/builder-v2-editor-*.ts"
      - "frontend/scripts/test-builder-v2-editor-*.mjs"
      - ".github/workflows/pagenova-editor-types.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare generated application types
        run: |
          node scripts/build-universal-utilities.mjs
          node scripts/install-frigolog.mjs
          npx next typegen
      - name: Typecheck full frontend
        run: npx tsc --noEmit --pretty false
