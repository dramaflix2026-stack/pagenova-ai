name: PageNova billing checks
on:
  pull_request:
    paths:
      - "frontend/src/lib/billing-*"
      - "frontend/src/lib/kiwify-subscription*"
      - "frontend/package.json"
      - "modules/stavo-crm/src/server/modules/billing/**"
      - "modules/stavo-crm/drizzle/**"
      - ".github/workflows/pagenova-billing-checks.yml"
  workflow_dispatch:
jobs:
  frontend-billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:billing
  crm-billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/stavo-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/stavo-crm/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test -- --run tests/unit/pagenova-quotas.test.ts
