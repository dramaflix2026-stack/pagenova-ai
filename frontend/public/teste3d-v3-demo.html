<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TacoLab — Scroll 2.5D</title><style>*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#100b09;color:white;font-family:Arial,sans-serif;overflow-x:hidden}.journey{height:440svh;position:relative}.stage{position:sticky;top:0;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 55% 65%,#4c2415,#170e0b 65%,#100b09)}.brand{position:absolute;top:6%;left:7%;font-size:19px;font-weight:900;letter-spacing:.2em;z-index:4}.brand span,.kicker,em{color:#ffac58}.badge{position:absolute;right:6%;top:6%;border:1px solid #8d6b56;border-radius:25px;padding:12px;font-size:10px;letter-spacing:.15em}.copy{position:absolute;top:19%;left:7%;right:7%;z-index:3;pointer-events:none}.kicker{font-size:11px;letter-spacing:.25em;font-weight:800}.copy h1{font-size:clamp(53px,10vw,108px);line-height:.91;letter-spacing:-.07em;margin:22px 0;max-width:620px}.copy em{font-style:normal}.copy p{color:#ddc4b5;font-size:clamp(15px,2vw,20px);line-height:1.5;max-width:360px}.visual{position:absolute;inset:35% 0 8%;display:grid;place-items:center;pointer-events:none}.taco{width:min(95vw,830px);max-height:100%;object-fit:contain;filter:drop-shadow(0 25px 45px #000a);will-change:transform;transition:none}.slice{position:absolute;inset:0;display:grid;place-items:center;opacity:0;will-change:transform,opacity}.slice img{width:min(95vw,830px);max-height:100%;object-fit:contain;filter:drop-shadow(0 20px 30px #0008)}.slice.a{clip-path:inset(0 0 68% 0)}.slice.b{clip-path:inset(29% 0 42% 0)}.slice.c{clip-path:inset(56% 0 18% 0)}.slice.d{clip-path:inset(79% 0 0 0)}.bottom{position:absolute;bottom:5%;left:7%;right:7%;display:flex;align-items:center;gap:16px;z-index:4;font-size:11px;letter-spacing:.15em}.track{height:2px;background:#6c4b3c;flex:1}.fill{height:100%;width:0;background:#ffac58}.end{min-height:100svh;display:grid;place-content:center;text-align:center;padding:40px;background:#130b08}.end h2{font-size:clamp(42px,8vw,80px);letter-spacing:-.06em}.end a{color:#ffb363}@media(max-width:650px){.badge{font-size:9px;padding:9px}.copy{top:19%}.copy h1{font-size:clamp(52px,13vw,76px)}.visual{inset:42% -8% 12%}.taco,.slice img{width:112vw}.bottom{bottom:7%}}@media(prefers-reduced-motion:reduce){.taco,.slice{transition:none}}</style></head><body><section class="journey" id="journey"><div class="stage"><div class="brand">TACO<span>LAB.</span></div><div class="badge">EXPERIMENTO 2.5D</div><div class="copy"><div class="kicker" id="kicker">UMA NOVA EXPERIÊNCIA</div><h1 id="heading">O SABOR<br>GANHA<br><em>VIDA.</em></h1><p id="desc">Deslize para descobrir uma experiência gastronômica cinematográfica.</p></div><div class="visual"><img class="taco" id="taco" alt="Taco realista com ingredientes frescos" src="https://similarpng.com/_next/image?q=75&amp;url=https%3A%2F%2Fimage.similarpng.com%2Ffile%2Fsimilarpng%2Fthumbnail%2Fthumbnail-906ee5ee-21d2-446b-b5e5-62b592f27245.png&amp;w=3840"><div class="slice a"><img alt="" src="https://similarpng.com/_next/image?q=75&amp;url=https%3A%2F%2Fimage.similarpng.com%2Ffile%2Fsimilarpng%2Fthumbnail%2Fthumbnail-906ee5ee-21d2-446b-b5e5-62b592f27245.png&amp;w=3840"></div><div class="slice b"><img alt="" src="https://similarpng.com/_next/image?q=75&amp;url=https%3A%2F%2Fimage.similarpng.com%2Ffile%2Fsimilarpng%2Fthumbnail%2Fthumbnail-906ee5ee-21d2-446b-b5e5-62b592f27245.png&amp;w=3840"></div><div class="slice c"><img alt="" src="https://similarpng.com/_next/image?q=75&amp;url=https%3A%2F%2Fimage.similarpng.com%2Ffile%2Fsimilarpng%2Fthumbnail%2Fthumbnail-906ee5ee-21d2-446b-b5e5-62b592f27245.png&amp;w=3840"></div><div class="slice d"><img alt="" src="https://similarpng.com/_next/image?q=75&amp;url=https%3A%2F%2Fimage.similarpng.com%2Ffile%2Fsimilarpng%2Fthumbnail%2Fthumbnail-906ee5ee-21d2-446b-b5e5-62b592f27245.png&amp;w=3840"></div></div><div class="bottom"><span id="step">01 / 04</span><div class="track"><div class="fill" id="fill"></div></div><span>ROLE PARA EXPLORAR ↓</span></div></div></section><section class="end"><h2>O PRÓXIMO<br><em>NÍVEL.</em></h2><p>Protótipo de animação com fotografia e rolagem nativa.</p><a href="/teste3d">Comparar com a primeira versão</a></section><script>const journey=document.getElementById('journey'),taco=document.getElementById('taco'),slices=[...document.querySelectorAll('.slice')],kicker=document.getElementById('kicker'),heading=document.getElementById('heading'),desc=document.getElementById('desc'),step=document.getElementById('step'),fill=document.getElementById('fill');const stages=[['UMA NOVA EXPERIÊNCIA','O SABOR<br>GANHA<br><em>VIDA.</em>','Uma experiência cinematográfica controlada pelo seu movimento.'],['MOVIMENTO NATURAL','SINTA<br>CADA<br><em>GIRO.</em>','Um produto realista em destaque.'],['DETALHES QUE IMPORTAM','TEXTURA.<br>COR.<br><em>SABOR.</em>','Aproxime-se de cada detalhe.'],['DESCONSTRUINDO O SABOR','CADA<br><em>CAMADA.</em>','Experimento visual com camadas fotográficas.']];let last=-1;function render(){const p=Math.max(0,Math.min(1,-journey.getBoundingClientRect().top/Math.max(1,journey.offsetHeight-innerHeight))),idx=Math.min(3,Math.floor(p*4));if(idx!==last){last=idx;kicker.textContent=stages[idx][0];heading.innerHTML=stages[idx][1];desc.textContent=stages[idx][2];step.textContent='0'+(idx+1)+' / 04'}const split=Math.max(0,Math.min(1,(p-.67)/.23)),rot=Math.sin(p*Math.PI*1.3)*10,scale=1+p*.14;taco.style.opacity=1-split;taco.style.transform='translate3d('+Math.sin(p*5)*20+'px,'+Math.sin(p*8)*10+'px,0) rotate('+rot+'deg) scale('+scale+')';slices.forEach((el,i)=>{el.style.opacity=split;el.style.transform='translate3d('+(i%2?1:-1)*split*24+'px,'+(i-1.5)*split*90+'px,0) rotate('+rot+'deg) scale('+scale+')'});fill.style.width=p*100+'%'}let pending=false;addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(()=>{render();pending=false})}},{passive:true});addEventListener('resize',render);render();</script></body></html>
