<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120906"><title>Taco Lab — Cinematic 3D V2</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#100906;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}body{overscroll-behavior-y:none}.journey{height:520vh}.stage{height:100svh;position:sticky;top:0;overflow:hidden;background:radial-gradient(ellipse at 68% 48%,#58271b 0%,#23120d 43%,#100906 82%)}.grain{position:absolute;inset:0;opacity:.25;background-image:repeating-linear-gradient(90deg,transparent 0 95px,#ffffff12 96px 97px);pointer-events:none}.top{position:absolute;top:0;left:0;right:0;padding:26px 6vw;display:flex;justify-content:space-between;align-items:center;z-index:3}.logo{font-weight:900;letter-spacing:.15em;font-size:19px}.logo b{color:#ff9e43}.chip{font-size:10px;letter-spacing:.18em;color:#f5d1b0;border:1px solid #ffffff40;border-radius:100px;padding:12px 15px}.content{position:absolute;z-index:2;left:7vw;top:31%;transform:translateY(-30%);max-width:500px;pointer-events:none}.kicker{font-size:11px;letter-spacing:.28em;color:#ffac58;font-weight:800;line-height:1.8}.content h1{font-size:clamp(55px,8vw,116px);line-height:.89;letter-spacing:-.065em;margin:18px 0 24px;font-weight:900}.content h1 em{font-style:normal;color:#ffac58}.content p{color:#d7bfb0;font-size:clamp(15px,1.45vw,19px);line-height:1.55;max-width:345px}.foot{position:absolute;bottom:28px;left:7vw;z-index:3;font-size:10px;letter-spacing:.23em;color:#f2caa4}.count{position:absolute;right:6vw;bottom:28px;z-index:3;font-size:11px;letter-spacing:.15em;color:#f2caa4}.bar{position:absolute;bottom:0;left:0;height:3px;width:0;background:#ffab51;z-index:5}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.end{height:85vh;display:grid;place-items:center;padding:10vw;text-align:center;background:radial-gradient(ellipse,#50251a,#100906 70%)}.end h2{font-size:clamp(43px,8vw,110px);letter-spacing:-.065em;line-height:.95;max-width:1000px}.end strong{color:#ffad56}.small{font-size:12px;letter-spacing:.17em;color:#d4a985}.content,.count{transition:opacity .18s ease}@media(max-width:700px){.top{padding:23px 6vw}.chip{font-size:8px;padding:10px}.content{top:27%;left:7vw;max-width:88vw}.content h1{font-size:clamp(54px,13vw,80px);margin:13px 0 18px}.content p{max-width:280px;font-size:14px}.kicker{font-size:10px}.foot{bottom:23px}.count{bottom:65px;right:7vw;font-size:9px}}
</style></head><body><main><section class="journey"><div class="stage"><div class="grain"></div><header class="top"><div class="logo">TACO<b>LAB.</b></div><div class="chip">CINEMATIC 3D · V2</div></header><div class="content"><div class="kicker" id="kicker">UMA NOVA DIMENSÃO DE SABOR</div><h1 id="heading">SABOR<br>QUE <em>FLUTUA.</em></h1><p id="desc">Uma experiência viva. Role para girar o taco e descobrir cada ingrediente.</p></div><div class="foot">↓ DESLIZE PARA EXPLORAR</div><div class="count" id="count">01 / 04 — ENTRADA</div><div class="bar" id="bar"></div><canvas id="canvas" aria-label="Animação tridimensional de taco e ingredientes"></canvas></div></section><section class="end"><div><div class="small">EXPERIÊNCIA 3D INTERATIVA</div><h2>CADA CAMADA.<br><strong>UMA HISTÓRIA.</strong></h2><p class="small">PROTÓTIPO VISUAL · PAGENOVA AI</p></div></section></main>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene(),canvas=document.querySelector('#canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
const camera=new T.PerspectiveCamera(37,1,.1,100);camera.position.set(0,0,12.5);
scene.add(new T.HemisphereLight(0xffedc7,0x7b301a,2.2));function light(color,intensity,x,y,z){const l=new T.PointLight(color,intensity,35);l.position.set(x,y,z);scene.add(l)}light(0xffb05e,130,3,5,6);light(0xff5531,75,-5,-3,3);light(0xffffff,45,0,2,-5);
const root=new T.Group();scene.add(root);const parts=[];const material=(c,rough=.85)=>new T.MeshStandardMaterial({color:c,roughness:rough,side:T.DoubleSide});
const tortilla=material(0xd9923d),gold=material(0xf5b75d),beef=material(0x67301b),beef2=material(0x934b26),green=material(0x4f9d35),green2=material(0x8bc84a),red=material(0xe4422a),red2=material(0xff7654),cream=material(0xffdf8b),cheddar=material(0xffb72f);
function rng(i){const x=Math.sin(i*127.1+78.23)*43758.5453;return x-Math.floor(x)}
function item(g,y,rot=0){root.add(g);parts.push({g,y,rot})}
function shell(){const g=new T.Group(),vertices=[],uv=[],indices=[];const seg=56,rows=16;for(let j=0;j<=rows;j++){const v=j/rows;const theta=-Math.PI*.66+v*Math.PI*1.32;for(let i=0;i<=seg;i++){const u=i/seg;const x=(u-.5)*3.25;const edge=Math.pow(Math.abs(u-.5)*2,3)*.13;const z=Math.sin(theta)*.87;const y=-.55+Math.cos(theta)*.83+edge;vertices.push(x,y,z);uv.push(u,v)}}for(let j=0;j<rows;j++)for(let i=0;i<seg;i++){const a=j*(seg+1)+i,b=a+seg+1;indices.push(a,b,a+1,b,b+1,a+1)}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(vertices,3));geo.setAttribute('uv',new T.Float32BufferAttribute(uv,2));geo.setIndex(indices);geo.computeVertexNormals();const m=new T.Mesh(geo,gold);g.add(m);const inside=new T.Mesh(geo,tortilla);inside.scale.set(.98,.98,.97);g.add(inside);for(let i=0;i<85;i++){const x=(rng(i)-.5)*2.9,z=(rng(i+90)-.5)*1.4;const fleck=new T.Mesh(new T.SphereGeometry(.025+rng(i+4)*.04,5,4),material(i%3?0x9f5928:0xc07d3c));fleck.position.set(x,-.55+Math.sqrt(Math.max(0,1-z*z))*.8+.02,z);fleck.scale.y=.12;g.add(fleck)}item(g,-.4)}
shell();
function groupLayer(y,n,kind){const g=new T.Group();for(let i=0;i<n;i++){const a=i*2.399,rad=Math.sqrt((i+.5)/n),x=Math.cos(a)*1.28*rad,z=Math.sin(a)*.58*rad;let mesh;if(kind==='beef'){mesh=new T.Mesh(new T.DodecahedronGeometry(.15+rng(i+20)*.15,0),i%3?beef:beef2)}else if(kind==='lettuce'){mesh=new T.Mesh(new T.PlaneGeometry(.27+rng(i+50)*.25,.20+rng(i+80)*.23,2,2),i%2?green:green2);mesh.rotation.set(rng(i+12)*2,0,rng(i+32)*3)}else if(kind==='tomato'){mesh=new T.Mesh(new T.SphereGeometry(.16+rng(i+3)*.07,12,8),i%3?red:red2);mesh.scale.set(1,.26,1)}else{mesh=new T.Mesh(new T.BoxGeometry(.19+rng(i+8)*.15,.08,.17+rng(i+12)*.13),i%3?cheddar:cream);mesh.rotation.y=rng(i+9)*4}mesh.position.set(x,(rng(i+19)-.5)*.15,z);mesh.rotation.y+=rng(i+70)*2;g.add(mesh)}item(g,y)}
groupLayer(-.12,42,'beef');groupLayer(.07,25,'cheese');groupLayer(.23,21,'tomato');groupLayer(.42,48,'lettuce');
const garnish=new T.Group();for(let i=0;i<12;i++){const leaf=new T.Mesh(new T.PlaneGeometry(.2,.33),i%2?green:green2);leaf.position.set((rng(i+3)-.5)*2.2,(rng(i+4)-.5)*.23,(rng(i+5)-.5)*.8);leaf.rotation.set(.7,rng(i+2)*3,rng(i+8)*5);garnish.add(leaf)}item(garnish,.55);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const clamp=v=>Math.min(1,Math.max(0,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};let progress=0,chapter=-1;const chapters=[['UMA NOVA DIMENSÃO DE SABOR','SABOR<br>QUE <em>FLUTUA.</em>','Uma experiência viva. Role para girar o taco e descobrir cada ingrediente.','01 / 04 — ENTRADA'],['MOVIMENTO CINEMATOGRÁFICO','GIRE.<br><em>DESCUBRA.</em>','O taco acompanha o movimento da página, em uma coreografia tridimensional.','02 / 04 — GIRO'],['O SEGREDO ESTÁ DENTRO','CAMADAS<br>DE <em>SABOR.</em>','Carne, queijo, tomate e folhas ganham vida em uma explosão controlada.','03 / 04 — EXPLOSÃO'],['A EXPERIÊNCIA SE COMPLETA','TUDO SE<br><em>ENCONTRA.</em>','Os ingredientes voltam ao lugar. Cada detalhe faz parte da experiência.','04 / 04 — UNIÃO']];
function frame(time){requestAnimationFrame(frame);const sec=document.querySelector('.journey');const raw=clamp(-sec.getBoundingClientRect().top/(sec.offsetHeight-innerHeight));progress+=(raw-progress)*.085;const p=progress;const opening=ease((p-.06)/.22),split=ease((p-.36)/.22)*(1-ease((p-.73)/.2));root.rotation.y=-.35+opening*Math.PI*.8+ease((p-.25)/.5)*Math.PI*1.8;root.rotation.x=.06+opening*.22+split*.14;root.rotation.z=Math.sin(time*.0007)*.035;root.position.set(innerWidth<700?0:2.1,(innerWidth<700?-1.55:-.1)+Math.sin(time*.0012)*.09,0);root.scale.setScalar(innerWidth<700?1.05:1.32);parts.forEach((v,i)=>{v.g.position.y=v.y+(i===0?-1:i-.6)*split*.75;v.g.position.x=(i===0?-.2:(i%2?-.15:.15))*split;v.g.rotation.y=(i%2?1:-1)*split*.25});const next=p<.22?0:p<.45?1:p<.77?2:3;if(next!==chapter){chapter=next;const c=chapters[next];document.querySelector('#kicker').textContent=c[0];document.querySelector('#heading').innerHTML=c[1];document.querySelector('#desc').textContent=c[2];document.querySelector('#count').textContent=c[3]}document.querySelector('#bar').style.width=p*100+'%';renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
