</style></head><body><main><section class="journey"><div class="stage"><div class="grain"></div><header class="top"><div class="logo">TACO<b>LAB.</b></div><div class="chip">CINEMATIC 3D · V2</div></header><div class="content"><div class="kicker" id="kicker">UMA NOVA DIMENSÃO DE SABOR</div><h1 id="heading">SABOR<br>QUE <em>FLUTUA.</em></h1><p id="desc">Uma experiência viva. Role para girar o taco e descobrir cada ingrediente.</p></div><div class="foot">↓ DESLIZE PARA EXPLORAR</div><div class="count" id="count">01 / 04 — ENTRADA</div><div class="bar" id="bar"></div><canvas id="canvas" aria-label="Animação tridimensional de taco e ingredientes"></canvas></div></section><section class="end"><div><div class="small">EXPERIÊNCIA 3D INTERATIVA</div><h2>CADA CAMADA.<br><strong>UMA HISTÓRIA.</strong></h2><p class="small">PROTÓTIPO VISUAL · PAGENOVA AI</p><a href="/teste3d" style="display:inline-block;margin-top:28px;padding:17px 26px;border:1px solid #f8ae63;border-radius:99px;color:#ffd4a4;text-decoration:none;font-size:12px;letter-spacing:.13em">COMPARAR COM V1 ↗</a></div></section></main>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene(),canvas=document.querySelector('#canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
const camera=new T.PerspectiveCamera(37,1,.1,100);camera.position.set(0,0,12.5);
scene.add(new T.HemisphereLight(0xffedc7,0x7b301a,2.2));function light(color,intensity,x,y,z){const l=new T.PointLight(color,intensity,35);l.position.set(x,y,z);scene.add(l)}light(0xffb05e,130,3,5,6);light(0xff5531,75,-5,-3,3);light(0xffffff,45,0,2,-5);
const root=new T.Group();scene.add(root);const parts=[];const material=(c,rough=.85)=>new T.MeshStandardMaterial({color:c,roughness:rough,side:T.DoubleSide});
function foodTexture(base,seed){const c=document.createElement('canvas');c.width=256;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,256,256);for(let i=0;i<2400;i++){const x=rng(i+seed)*256,y=rng(i+seed+3000)*256,r=1+rng(i+seed+6000)*5;ctx.globalAlpha=.025+rng(i+seed+9000)*.18;ctx.fillStyle=i%3===0?'#57210d':i%3===1?'#fff2ba':'#a65421';ctx.beginPath();ctx.ellipse(x,y,r,r*.6,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;return t}const tortilla=material(0xd9923d),gold=material(0xf5b75d),beef=material(0x67301b),beef2=material(0x934b26),green=material(0x4f9d35),green2=material(0x8bc84a),red=material(0xe4422a),red2=material(0xff7654),cream=material(0xffdf8b),cheddar=material(0xffb72f);
gold.map=foodTexture('#e7a352',91);gold.needsUpdate=true;tortilla.map=foodTexture('#bd793c',37);tortilla.needsUpdate=true;
function rng(i){const x=Math.sin(i*127.1+78.23)*43758.5453;return x-Math.floor(x)}
function item(g,y,rot=0){root.add(g);parts.push({g,y,rot})}
function shell(){const g=new T.Group(),verts=[],indices=[];const nx=44,nz=28;for(let j=0;j<=nz;j++){const v=j/nz*2-1;for(let i=0;i<=nx;i++){const u=i/nx*2-1;const taper=Math.sqrt(Math.max(.001,1-u*u));const x=u*1.7;const z=v*1.0*taper;const bend=.74*Math.pow(Math.abs(v),2.4);const y=-.60+bend+.07*Math.pow(Math.abs(u),3);verts.push(x,y,z)}}for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){const a=j*(nx+1)+i,b=a+nx+1;indices.push(a,a+1,b,b,a+1,b+1)}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();const outside=new T.Mesh(geo,gold);g.add(outside);const inner=new T.Mesh(geo,tortilla);inner.position.y=.024;g.add(inner);for(let i=0;i<125;i++){const u=(rng(i+7)-.5)*1.85,v=(rng(i+90)-.5)*1.8;const x=u*1.7,z=v*Math.sqrt(Math.max(.001,1-u*u))*1.0;const y=-.57+.74*Math.pow(Math.abs(v),2.4)+.07*Math.pow(Math.abs(u),3);const fleck=new T.Mesh(new T.SphereGeometry(.012+rng(i+4)*.026,5,4),i%3?beef2:beef);fleck.position.set(x,y+.027,z);fleck.scale.y=.12;g.add(fleck)}item(g,-.4)}
shell();
function groupLayer(y,n,kind){const g=new T.Group();for(let i=0;i<n;i++){const a=i*2.399,rad=Math.sqrt((i+.5)/n),x=Math.cos(a)*1.28*rad,z=Math.sin(a)*.58*rad;let mesh;if(kind==='beef'){mesh=new T.Mesh(new T.DodecahedronGeometry(.15+rng(i+20)*.15,0),i%3?beef:beef2)}else if(kind==='lettuce'){mesh=new T.Mesh(new T.PlaneGeometry(.27+rng(i+50)*.25,.20+rng(i+80)*.23,2,2),i%2?green:green2);mesh.rotation.set(rng(i+12)*2,0,rng(i+32)*3)}else if(kind==='tomato'){mesh=new T.Mesh(new T.SphereGeometry(.16+rng(i+3)*.07,12,8),i%3?red:red2);mesh.scale.set(1,.26,1)}else{mesh=new T.Mesh(new T.BoxGeometry(.19+rng(i+8)*.15,.08,.17+rng(i+12)*.13),i%3?cheddar:cream);mesh.rotation.y=rng(i+9)*4}mesh.position.set(x,(rng(i+19)-.5)*.15,z);mesh.rotation.y+=rng(i+70)*2;g.add(mesh)}item(g,y)}
groupLayer(-.12,42,'beef');groupLayer(.07,25,'cheese');groupLayer(.23,21,'tomato');groupLayer(.42,48,'lettuce');
const garnish=new T.Group();for(let i=0;i<12;i++){const leaf=new T.Mesh(new T.PlaneGeometry(.2,.33),i%2?green:green2);leaf.position.set((rng(i+3)-.5)*2.2,(rng(i+4)-.5)*.23,(rng(i+5)-.5)*.8);leaf.rotation.set(.7,rng(i+2)*3,rng(i+8)*5);garnish.add(leaf)}item(garnish,.55);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const clamp=v=>Math.min(1,Math.max(0,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};let progress=0,chapter=-1;const chapters=[['UMA NOVA DIMENSÃO DE SABOR','SABOR<br>QUE <em>FLUTUA.</em>','Uma experiência viva. Role para girar o taco e descobrir cada ingrediente.','01 / 04 — ENTRADA'],['MOVIMENTO CINEMATOGRÁFICO','GIRE.<br><em>DESCUBRA.</em>','O taco acompanha o movimento da página, em uma coreografia tridimensional.','02 / 04 — GIRO'],['O SEGREDO ESTÁ DENTRO','CAMADAS<br>DE <em>SABOR.</em>','Carne, queijo, tomate e folhas ganham vida em uma explosão controlada.','03 / 04 — EXPLOSÃO'],['A EXPERIÊNCIA SE COMPLETA','TUDO SE<br><em>ENCONTRA.</em>','Os ingredientes voltam ao lugar. Cada detalhe faz parte da experiência.','04 / 04 — UNIÃO']];
function frame(time){requestAnimationFrame(frame);const sec=document.querySelector('.journey');const raw=clamp(-sec.getBoundingClientRect().top/Math.max(1,sec.offsetHeight-innerHeight));progress+=(raw-progress)*.085;const p=progress;const opening=ease((p-.06)/.22),split=ease((p-.36)/.22)*(1-ease((p-.73)/.2));root.rotation.y=-.35+opening*Math.PI*.8+ease((p-.25)/.5)*Math.PI*1.8;root.rotation.x=.06+opening*.22+split*.14;root.rotation.z=Math.sin(time*.0007)*.035;root.position.set(innerWidth<700?0:2.1,(innerWidth<700?-1.48:-.1)+Math.sin(time*.0012)*.09,0);root.scale.setScalar(innerWidth<700?1.02:1.27);parts.forEach((v,i)=>{v.g.position.y=v.y+(i===0?-1:i-.6)*split*.75;v.g.position.x=(i===0?-.2:(i%2?-.15:.15))*split;v.g.rotation.y=(i%2?1:-1)*split*.25});const next=p<.22?0:p<.45?1:p<.77?2:3;if(next!==chapter){chapter=next;const c=chapters[next];document.querySelector('#kicker').textContent=c[0];document.querySelector('#heading').innerHTML=c[1];document.querySelector('#desc').textContent=c[2];document.querySelector('#count').textContent=c[3]}document.querySelector('#bar').style.width=p*100+'%';renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
