<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TacoLab — Flow Scroll</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#11100f;color:#f9f3eb;font-family:system-ui,sans-serif}
.scroll{height:420svh}.sticky{position:sticky;top:0;height:100svh;overflow:hidden;background:#151515;display:grid;place-items:center}
canvas{position:absolute;width:100%;height:100%;object-fit:contain}.overlay{position:absolute;top:7%;left:6%;right:6%;z-index:2;pointer-events:none;text-shadow:0 2px 12px #0008}.overlay strong{font-size:clamp(30px,6vw,66px);letter-spacing:-.04em;line-height:1}.overlay small{display:block;color:#e2a35b;letter-spacing:.18em;font-size:10px;margin-bottom:12px}
.bottom{position:absolute;bottom:7%;left:6%;right:6%;display:flex;justify-content:space-between;gap:10px;z-index:2;font-size:11px}.bar{position:absolute;bottom:0;left:0;height:3px;background:#eea24e;width:0}.hint{color:#c6b6a8}
#error{position:absolute;z-index:4;inset:auto 7% 22%;padding:16px;background:#221a15e8;border:1px solid #76502f;border-radius:12px;font-size:13px;line-height:1.5;display:none;max-width:500px}
@media(max-width:650px){.overlay{top:9%}.overlay strong{font-size:clamp(34px,10vw,52px)}.bottom{font-size:9px}}
</style></head><body><section class="scroll" id="scroll"><div class="sticky"><canvas id="scene" aria-label="Animação cinematográfica controlada pelo scroll"></canvas><div class="overlay"><small>PAGENOVA · FLOW MOTION</small><strong>O SABOR<br>EM MOVIMENTO.</strong></div><div id="error" role="status"></div><div class="bottom"><span class="hint" id="hint">CARREGANDO QUADROS…</span><span id="percent">0%</span></div><div class="bar" id="bar"></div></div></section><script src="/tacolab-flow-scroll.js" defer></script></body></html>
