<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Taco 3D Experience — Protótipo</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#100b09;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.stage{height:420vh;position:relative}.sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 70% 45%,#482018 0%,#170e0c 43%,#100b09 80%)}.noise{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 90px,#ffffff05 91px 92px)}header{position:absolute;z-index:3;top:0;left:0;right:0;padding:30px 6vw;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.18em;font-size:18px}.brand span{color:#ffae54}.tag{font-size:11px;letter-spacing:.24em;color:#e7c8a8;border:1px solid #ffffff35;border-radius:30px;padding:12px 16px}.copy{position:absolute;z-index:2;left:8vw;top:50%;transform:translateY(-50%);max-width:530px;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.34em;color:#ffb35d;font-weight:700;margin-bottom:20px}.copy h1{font-size:clamp(55px,8vw,130px);line-height:.88;letter-spacing:-.075em;margin:0 0 24px;font-weight:900}.copy h1 em{font-style:normal;color:#ffad52}.copy p{color:#c8b6ac;max-width:340px;font-size:clamp(15px,1.5vw,19px);line-height:1.6}.scroll{position:absolute;z-index:4;bottom:32px;left:8vw;font-size:11px;letter-spacing:.2em;color:#d8ad86}.progress{position:absolute;z-index:5;bottom:0;left:0;height:3px;background:#ffab52;width:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.chapter{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#120b08;padding:25px}.chapter h2{font-size:clamp(42px,7vw,95px);line-height:1;letter-spacing:-.06em;max-width:950px}.chapter strong{color:#ffab52}.note{position:absolute;z-index:2;right:7vw;bottom:11vh;color:#ffe4c8;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.fade{transition:opacity .2s} @media(max-width:700px){header{padding:22px}.tag{font-size:8p </style></head><body><main><section class="stage"><div class="sticky"><div class="noise"></div><header><div class="brand">TACO<span>LAB.</span></div><div class="tag">EXPERIÊNCIA 3D • PROTÓTIPO</div></header><div class="copy fade" id="copy"><div class="eyebrow" id="eyebrow">UMA EXPERIÊNCIA EXTRAORDINÁRIA</div><h1 id="headline">NÃO É<br/>SÓ UM<br/><em>TACO.</em></h1><p id="desc">É uma explosão de sabores. Role a página e descubra cada camada.</p></div><div class="note" id="note">01 / 04 — O INÍCIO</div><div class="scroll">↓ ROLE PARA EXPLORAR</div><div class="progress" id="progress"></div><canvas id="scene"></canvas></div></section><section class="chapter"><h2>O SABOR TEM <strong>OUTRA DIMENSÃO.</strong></h2></section></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const canvas=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,1,.1,100);camera.position.set(0,0,12);
scene.add(new THREE.AmbientLight(0xffdfbd,1.6));const light=new THREE.DirectionalLight(0xffb16d,3.2);light.position.set(3,6,8);scene.add(light);const rim=new THREE.PointLight(0xff5722,65);rim.position.set(-4,-2,4);scene.add(rim);
const root=new THREE.Group();scene.add(root);const mat=(c,r=.65)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0,side:THREE.DoubleSide});
const shell=mat(0xe7a653),beef=mat(0x6a3020),lettuce=mat(0x62b83e),tomato=mat(0xe94c32),cheese=mat(0xffca3e);
const layers=[];
function addLayer(y,color,rx,rz,thickness,seed){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(rx,rx*.93,thickness,48),color);base.scale.z=rz/rx;g.add(base);for(let i=0;i<16;i++){const a=i*2.399+seed;const rad=Math.sqrt((i+.5)/16);const bit=new THREE.Mesh(new THREE.IcosahedronGeometry(.11+(i%4)*.025,0),color);bit.position.set(Math.cos(a)*rx*.8*rad,thickness*.55+Math.sin(i)*.06,Math.sin(a)*rz*.8*rad);bit.rotation.set(i,0,i*.5);g.add(bit)}g.position.y=y;root.add(g);layers.push({g,y});}
addLayer(-.67,shell,1.8,1.15,.20,1);addLayer(-.36,beef,1.6,.98,.23,2);addLayer(-.05,cheese,1.65,1.02,.12,3);addLayer(.21,tomato,1.5,.93,.17,4);addLayer(.47,lettuce,1.68,1.08,.18,5);
const top=new THREE.Mesh(new THREE.TorusGeometry(1.5,.13,12,60,Math.PI),shell);top.rotation.x=Math.PI/2;top.position.y=.67;root.add(top);
const state={p:0};function clamp(x){return Math.max(0,Math.min(1,x))}function smooth(x){x=clamp(x);return x*x*(3-2*x)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const copy=document.querySelector('#copy'),headline=document.querySelector('#headline'),desc=document.querySelector('#desc'),eyebrow=document.querySelector('#eyebrow'),note=document.querySelector('#note');
let prev=-1;function animate(t){requestAnimationFrame(animate);const section=document.querySelector('.stage');const p=clamp(-section.getBoundingClientRect().top/(section.offsetHeight-innerHeight));state.p+=(p-state.p)*.075;const q=state.p;const explode=smooth((q-.24)/.29)*(1-smooth((q-.73)/.20));const rotate=smooth((q-.10)/.7);
root.position.x=innerWidth>700?2.25:0;root.position.y=(innerWidth>700?0:-1.55)+Math.sin(t*.0013)*.11;root.rotation.y=-.45+rotate*Math.PI*2.2;root.rotation.x=.18+rotate*.5;root.rotation.z=Math.sin(t*.0006)*.045;root.scale.setScalar(innerWidth>700?1.23:.86);
layers.forEach((l,i)=>{l.g.position.y=l.y+(i-2)*explode*.75;l.g.rotation.y=explode*(i%2?-.2:.2)});top.position.y=.67+explode*2.4;
const chapter=q<.20?0:q<.46?1:q<.77?2:3;if(chapter!==prev){prev=chapter;const arr=[['UMA EXPERIÊNCIA EXTRAORDINÁRIA','NÃO É<br/>SÓ UM<br/><em>TACO.</em>','É uma explosão de sabores. Role a página e descubra cada camada.','01 / 04 — O INÍCIO'],['O MOVIMENTO COMEÇA','SINTA<br/>CADA<br/><em>GIRO.</em>','Uma experiência tridimensional guiada pelo seu scroll.','02 / 04 — ROTAÇÃO'],['CADA CAMADA IMPORTA','FEITO DE<br/><em>SABOR.</em>','Ingredientes separados em tempo real, diretamente no navegador.','03 / 04 — INGREDIENTES'],['TUDO SE ENCONTRA','A MÁGICA<br/><em>ACONTECE.</em>','A experiência se reconstrói enquanto você continua a explorar.','04 / 04 — RECONSTRUÇÃO']][chapter];eyebrow.textContent=arr[0];headline.innerHTML=arr[1];desc.textContent=arr[2];note.textContent=arr[3]}document.querySelector('#progress').style.width=(q*100)+'%';renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
